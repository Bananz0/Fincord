# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# JDK 25 builds this project. It did not under AGP 8: on 25 the JVM prints a warning about
# restricted System::load calls when Gradle's native-platform library loads, and AGP 8 ran prefab in
# a forked JVM whose every line of stderr it reported as an error, so hificore's native build died
# on that warning alone. AGP 9 builds prefab packages in process, and the warning has nothing left
# to break. That is what the move to AGP 9.4 was for.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# Generate compile-time only R class for app modules
android.enableAppCompileTimeRClass=true
# Gradle
org.gradle.configuration-cache=true
org.gradle.configureondemand=true
org.gradle.caching=true
# Build BuildConfig as Bytecode
android.enableBuildConfigAsBytecode=true
# Enable ksp 2
ksp.useKSP2=true
# Android 16
android.suppressUnsupportedCompileSdk=36

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# AGP 9 compiles Kotlin itself, and every module here has had org.jetbrains.kotlin.android removed
# accordingly - the two cannot both be applied. AGP's opt-out (android.builtInKotlin=false,
# android.newDsl=false) was tried and abandoned: the Kotlin plugin then demands the legacy
# BaseExtension, which the new DSL no longer hands it, and turning the new DSL off in turn breaks
# the source-set blocks in :recyclerview and :libPhonograph. Built-in Kotlin is the only coherent
# position, and the opt-out disappears in AGP 10 regardless.
#
# One consequence to keep an eye on: built-in Kotlin pins the compiler at 2.4.10, above the 2.3.0
# the parcelize plugin and KSP 2.3.11 are built for - KSP has no 2.4 release yet. Room's processor
# runs and its output compiles, but this is a version skew, not a matched set, and a Room or KSP
# upgrade should be the moment to re-check it rather than a routine bump.
